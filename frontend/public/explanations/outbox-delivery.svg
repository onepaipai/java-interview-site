<svg xmlns="http://www.w3.org/2000/svg" width="320" height="570" viewBox="0 0 320 570" role="img" aria-labelledby="title desc">
<title id="title">Outbox：本地事实与可靠投递</title><desc id="desc">业务和待发送事件在一个本地事务提交。发送器可重试，消费端用业务键幂等处理。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#969bb1"/></marker></defs>
<rect width="320" height="570" rx="18" fill="#f8f8fc"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#383953">
<text x="160" y="36" font-size="18" font-weight="700">本地提交与外部投递分开</text>
<rect x="24" y="61" width="272" height="148" rx="12" fill="#f2efff" stroke="#dcd5f3"/>
<text x="160" y="88" font-size="16" fill="#75639b">同一个数据库事务</text>
<rect x="42" y="104" width="236" height="41" rx="8" fill="#fff"/><text x="160" y="131" font-size="18">写业务事实</text>
<rect x="42" y="155" width="236" height="36" rx="8" fill="#fff"/><text x="160" y="179" font-size="18">写待发送事件</text>
<g stroke="#969bb1" stroke-width="2" marker-end="url(#arrow)"><path d="M160 211v32"/><path d="M160 315v32"/><path d="M160 419v32"/></g>
<rect x="30" y="250" width="260" height="64" rx="11" fill="#fff" stroke="#e0e3ed"/>
<text x="160" y="278" font-size="18">发送器扫描并投递</text><text x="160" y="300" font-size="15" fill="#838399">失败重试，成功记录状态</text>
<rect x="30" y="354" width="260" height="64" rx="11" fill="#fff" stroke="#e0e3ed"/>
<text x="160" y="382" font-size="18">消息允许重复到达</text><text x="160" y="404" font-size="15" fill="#838399">发送后退出可能再次投递</text>
<rect x="30" y="458" width="260" height="70" rx="11" fill="#eff7f3" stroke="#d6e8dc"/>
<text x="160" y="487" font-size="18" fill="#43735b">消费端业务幂等</text><text x="160" y="511" font-size="15" fill="#688373">去重结果与业务同事务</text>
<text x="160" y="553" font-size="13" fill="#9392a5">最终收敛还需告警与核对</text></g></svg>
