name: java-interview
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interview
      MYSQL_USER: interview
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u interview -D interview -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SINGLE_INSTANCE_LOCK: "true"
      DB_URL: jdbc:mysql://db:3306/interview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: interview
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_PATH: /app/content/Java.md
      UPLOAD_DIR: /app/data/uploads
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-30}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-2}
      AI_CHAT_TIMEOUT_MS: ${AI_CHAT_TIMEOUT_MS:-90000}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-20000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_MAX_INPUT_CHARACTERS: ${AI_MAX_INPUT_CHARACTERS:-80000}
      SEARCH_MAX_CHARACTERS: ${SEARCH_MAX_CHARACTERS:-20000000}
      KNOWLEDGE_MAX_CHARACTERS: ${KNOWLEDGE_MAX_CHARACTERS:-5000000}
      KNOWLEDGE_MAX_CHUNKS: ${KNOWLEDGE_MAX_CHUNKS:-10000}
      KNOWLEDGE_MAX_VECTOR_BYTES: ${KNOWLEDGE_MAX_VECTOR_BYTES:-134217728}
    volumes:
      - ./content:/app/content:ro
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  mysql-data:
  uploads:
