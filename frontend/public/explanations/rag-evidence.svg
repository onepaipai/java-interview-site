<svg xmlns="http://www.w3.org/2000/svg" width="320" height="580" viewBox="0 0 320 580" role="img" aria-labelledby="title desc">
<title id="title">RAG：证据进入回答的边界</title><desc id="desc">用户问题经过权限过滤、混合召回、重排与引用校验后生成回答。无证据时明确说明缺失。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#9c9ab6"/></marker></defs>
<rect width="320" height="580" rx="18" fill="#f8f8fc"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#383953">
<text x="160" y="36" font-size="18" font-weight="700">先取证据，再组织回答</text>
<g stroke="#dfddef" fill="#fff"><rect x="30" y="60" width="260" height="66" rx="11"/><rect x="30" y="162" width="260" height="66" rx="11"/><rect x="30" y="264" width="260" height="66" rx="11"/><rect x="30" y="366" width="260" height="66" rx="11"/></g>
<g stroke="#9c9ab6" stroke-width="2" marker-end="url(#arrow)"><path d="M160 128v27"/><path d="M160 230v27"/><path d="M160 332v27"/><path d="M160 434v27"/></g>
<text x="160" y="88" font-size="18">身份与权限过滤</text><text x="160" y="111" font-size="15" fill="#838399">无权资料不进入候选</text>
<text x="160" y="190" font-size="18">关键词 + 向量召回</text><text x="160" y="213" font-size="15" fill="#838399">保留精确编号与语义</text>
<text x="160" y="292" font-size="18">重排与上下文选择</text><text x="160" y="315" font-size="15" fill="#838399">保留版本、条件和来源</text>
<text x="160" y="394" font-size="18">生成并核对引用</text><text x="160" y="417" font-size="15" fill="#838399">引用必须对应本次证据</text>
<rect x="30" y="468" width="260" height="70" rx="11" fill="#eff7f3" stroke="#d6e8dc"/>
<text x="160" y="497" font-size="18" fill="#43735b">有依据才下结论</text><text x="160" y="521" font-size="15" fill="#688373">缺证据时明确说明</text>
<text x="160" y="563" font-size="13" fill="#9392a5">相似度 ≠ 事实正确率</text></g></svg>
