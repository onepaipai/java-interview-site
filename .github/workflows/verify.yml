name: Verify
on: [push, pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_DATABASE: interview_test
          MYSQL_USER: interview
          MYSQL_PASSWORD: isolated-test-password
          MYSQL_ROOT_PASSWORD: isolated-test-root-password
        ports: ['13316:3306']
        options: >-
          --health-cmd="MYSQL_PWD=isolated-test-password mysql -h 127.0.0.1 -u interview -D interview_test -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: mvn -B clean verify
        working-directory: backend
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:13316/interview_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          MYSQL_TEST_USER: interview
          MYSQL_TEST_PASSWORD: isolated-test-password
      - run: npm ci && npm test && npm run format:check && npm run build && npm run test:knowledge-core
        working-directory: frontend
      - run: node frontend/node_modules/prettier/bin/prettier.cjs --plugin=./frontend/node_modules/prettier-plugin-java/dist/index.mjs --check "backend/src/**/*.java"
      - run: node scripts/verify-contract.mjs && node scripts/sync-content-status.mjs --check && node scripts/validate-content.mjs && node scripts/validate-explanations.mjs
      - run: docker compose --env-file .env.example config --quiet
      - run: node scripts/check-deployment-config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-build
          path: |
            backend/target/interview-site-1.0.0.jar
            backend/target/surefire-reports/
            frontend/dist/
  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t interview-backend:smoke .
      - name: Build frontend image
        run: docker build -t interview-frontend:smoke ./frontend
  browser:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # core：阅读主流程；ui：交互/管理/知识库套件。两组并行，避免套件长期不进 CI 而腐化。
          - group: core
            suites: test:learning-reader test:catalog test:e2e test:review test:deep-reader test:spring-core-reader test:spring-advanced-reader test:database-basics-reader
          - group: ui
            suites: test:interactions test:ai test:regressions test:details test:polish test:knowledge test:knowledge-layout test:explanation-reader test:explanation-pack test:explanations test:data-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chrome
        working-directory: frontend
      - run: mvn -B package -DforkCount=0
        working-directory: backend
      - run: $suites=@($env:SUITES -split '\s+'); ./scripts/test-e2e.ps1 -Suite $suites
        shell: pwsh
        env:
          SUITES: ${{ matrix.suites }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: frontend/test-results/
