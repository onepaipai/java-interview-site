limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
map $http_x_forwarded_proto $forwarded_scheme { default $scheme; https https; }
server {
 listen 8080;
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 10.0.0.0/8;
 set_real_ip_from 192.168.0.0/16;
 real_ip_header X-Real-IP;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 12m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location = /api/login {
  limit_req zone=login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_scheme;
 }
 location /api/ {
  proxy_read_timeout 130s;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_scheme;
 }
 location /uploads/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_scheme;
 }
 location /assets/ { expires 1y; }
 location / { try_files $uri $uri/ /index.html; expires -1; }
}
